# Exercises containerd + runc only -- hostNetwork skips CNI entirely.
apiVersion: v1
kind: Pod
metadata:
  # Object names are DNS-1123 labels, so hyphens rather than snake_case.
  name: host-network
  namespace: default
spec:
  hostNetwork: true
  containers:
    - name: c
      image: docker.io/library/busybox:latest
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep 3600"]
