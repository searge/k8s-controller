# zizmor configuration. Run with:
#   uvx zizmor --persona=regular .github/workflows/
#
# Only findings that cannot be fixed without a redesign are listed here. Anything
# else should be fixed in the workflow instead of silenced.
rules:
  dangerous-triggers:
    ignore:
      # release.yml is triggered by workflow_run on "Security Checks". The trigger
      # is inherent to the current release chain: a v*.*.* tag starts Security
      # Checks, and Release only runs if that succeeded. Replacing it means moving
      # the security gate into the release workflow itself, which is a redesign of
      # the release pipeline rather than a hardening change.
      #
      # The two concrete risks the audit warns about are handled explicitly:
      #   - workflow_run.head_branch is passed through the step environment and
      #     validated against ^v[0-9]+\.[0-9]+\.[0-9]+$ before use.
      #   - every checkout pins `ref:` to that tag, because workflow_run would
      #     otherwise check out the default branch and release artifacts built
      #     from main under a tag's name.
      - release.yml
