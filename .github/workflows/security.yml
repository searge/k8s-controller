name: "Security Checks"

# Called by release.yml rather than triggered directly. Previously this ran on
# `push: tags` and Release hung off it via `workflow_run`; that trigger made
# Release run in the default branch's context, so its checkouts needed an
# explicit `ref:` to get the tag -- which scanners read as checking out
# untrusted code. As a called workflow, github.ref is the caller's tag and no
# dynamic ref is needed anywhere.
on:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions: {}

jobs:
  build-and-scan:
    runs-on: ubuntu-24.04
    permissions:
      # The image is built with `push: false` into a local tarball and never
      # pushed from here, so `packages: write` is not needed; `contents: write`
      # was only ever used for the checkout.
      contents: read
      security-events: write   # uploads trivy-results.sarif to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod rather than a literal version: setup-go v6+ sets
          # GOTOOLCHAIN=local, so a pinned `go-version` that resolves below
          # go.mod's `go` directive fails the build instead of fetching the
          # newer toolchain.
          go-version-file: go.mod
          # Cache disabled: this workflow builds and publishes a release image, so
          # a poisoned cache entry written by a lower-privileged run would end up
          # inside a published artifact. Costs a cold module download per release.
          cache: false

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Setup Taskfile
        # Was Illbjorn/setup-task@0.1.0, whose repository no longer exists on
        # GitHub. That is worse than an unpinned action: a deleted namespace can
        # be re-registered by anyone, and this workflow can write to the repo and
        # the registry. Replaced with the action maintained by the Task project.
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: 3.x

      # Quick smoke test - if it builds, it's probably fine
      - name: Build application
        run: task build
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Build image locally first for security scanning
      - name: Build Docker image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64  # Single platform for scanning
          push: false
          tags: ${{ env.IMAGE_NAME }}:scan
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          outputs: type=docker,dest=/tmp/image.tar

      - name: Load image for scanning
        run: docker load -i /tmp/image.tar

      # Security scan BEFORE pushing to registry
      - name: Run Trivy vulnerability scanner (Critical/High only)
        id: trivy-gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # Fail the build if critical/high vulnerabilities found

      # if: always() matters -- the gate above exits 1 on a finding, and that is
      # exactly when the SARIF is worth having in code scanning. Without it the
      # upload would be skipped on every run that actually found something.
      - name: Upload Trivy results to code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # Generate readable summary for GitHub Actions
      - name: Run Trivy for GitHub Summary
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: 'table'
          output: 'trivy-summary.txt'

      - name: Add Trivy scan results to summary
        env:
          # Through the environment, not interpolated into the script. A tag name
          # may legally contain `$( )` and backticks -- git check-ref-format
          # allows them -- so expanding the version here would run commands.
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## 🛡️ Security Scan Results"
            echo ""
            echo "### Image: \`${IMAGE_NAME}:${VERSION}\`"
            echo ""
            echo '```'
            cat trivy-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
