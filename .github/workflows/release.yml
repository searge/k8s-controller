name: Release

on:
  workflow_run:
    workflows: ["Security Checks"]
    types:
      - completed

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# No workflow-level permissions: only build-docker needs to write packages and
# only create-release needs to write contents.
permissions: {}

jobs:
  # Simple check: if security passed, we can release
  check-security:
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.conclusion == 'success'
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from branch
        id: version
        env:
          # Passed through the environment rather than interpolated into the
          # script. head_branch is attacker-controlled -- a tag or branch named
          # with shell metacharacters would otherwise execute here, and this
          # workflow can write to the repo and the registry.
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # Security Checks only runs on v*.*.* tags, so this must look like one.
          if [[ ! "$HEAD_BRANCH" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::refusing to release from unexpected ref: $HEAD_BRANCH"
            exit 1
          fi
          echo "version=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "✅ Security checks passed for: $HEAD_BRANCH"

  # Build binaries for multiple platforms
  build-binaries:
    needs: check-security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            platform: linux
            arch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            platform: linux
            arch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            platform: darwin
            arch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            platform: darwin
            arch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            platform: windows
            arch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: "./go.mod"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -v \
            -ldflags "-w -s -X=github.com/Searge/k8s-controller/cmd.Version=${{ needs.check-security.outputs.version }}" \
            -o dist/kc${{ matrix.ext }} \
            main.go

      - name: Create archive
        run: |
          cd dist
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            zip -r ../kc.${{ matrix.platform }}.${{ matrix.arch }}.zip kc${{ matrix.ext }}
          else
            tar -czf ../kc.${{ matrix.platform }}.${{ matrix.arch }}.tar.gz kc${{ matrix.ext }}
          fi
          cd ..
          ls -la kc.*

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: kc-${{ matrix.platform }}-${{ matrix.arch }}
          path: kc.${{ matrix.platform }}.${{ matrix.arch }}.*

  # Build and push Docker images
  build-docker:
    needs: check-security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # pushes the image to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags
        id: meta
        run: |
          VERSION="${{ needs.check-security.outputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          # Generate tags manually
          TAGS="${IMAGE}:${VERSION}"
          TAGS="${TAGS},${IMAGE}:latest"

          # Extract semver parts if it's a proper version
          if [[ "$VERSION" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            TAGS="${TAGS},${IMAGE}:${MAJOR}.${MINOR}.${PATCH}"
            TAGS="${TAGS},${IMAGE}:${MAJOR}.${MINOR}"
            TAGS="${TAGS},${IMAGE}:${MAJOR}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Generated tags: ${TAGS}"

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.check-security.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Create GitHub Release with all artifacts
  create-release:
    runs-on: ubuntu-24.04
    needs: [check-security, build-binaries, build-docker]
    permissions:
      contents: write   # creates the GitHub release
    steps:
      - uses: actions/checkout@v4

      # Download all binary artifacts
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      # Prepare release files
      - name: Prepare release files
        run: |
          mkdir -p release-files
          find ./artifacts -name "kc.*" -type f -exec cp {} release-files/ \;
          ls -la release-files/

      # Extract changelog
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION_NUMBER=$(echo "${{ needs.check-security.outputs.version }}" | sed 's/^v//')
          if [ -f "CHANGELOG.md" ]; then
            awk '/^## \['"$VERSION_NUMBER"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > current_changelog.md
            if [ -s current_changelog.md ]; then
              # Random delimiter: a changelog line that is literally "EOF" would
              # otherwise close the value early, truncating the release body or
              # letting the file inject further step outputs.
              delimiter="changelog_$(uuidgen)"
              {
                echo "changelog<<$delimiter"
                cat current_changelog.md
                echo "$delimiter"
              } >> "$GITHUB_OUTPUT"
            else
              echo "changelog=No changelog found for version $VERSION_NUMBER" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changelog=No CHANGELOG.md file found" >> "$GITHUB_OUTPUT"
          fi

      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.check-security.outputs.version }}
          name: Release ${{ needs.check-security.outputs.version }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ## 📦 Downloads

            **Docker Image:**
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.check-security.outputs.version }}
            ```

            **Binary Archives:**
            - **Linux (amd64)**: `kc.linux.amd64.tar.gz`
            - **Linux (arm64)**: `kc.linux.arm64.tar.gz`
            - **macOS (Intel)**: `kc.darwin.amd64.tar.gz`
            - **macOS (Apple Silicon)**: `kc.darwin.arm64.tar.gz`
            - **Windows (amd64)**: `kc.windows.amd64.zip`

            **Installation:**
            ```bash
            # Linux/macOS
            tar -xzf kc.linux.amd64.tar.gz
            chmod +x kc
            sudo mv kc /usr/local/bin/

            # Windows
            # Extract kc.windows.amd64.zip and add kc.exe to PATH
            ```
          draft: false
          prerelease: ${{ contains(needs.check-security.outputs.version, '-') }}
          files: |
            release-files/*
          generate_release_notes: true
