name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# No workflow-level permissions: only build-docker needs to write packages and
# only create-release needs to write contents.
permissions: {}

jobs:
  # Build the image and scan it. Nothing below runs unless this passes.
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      # A called workflow cannot exceed what the calling job grants, so these
      # mirror the permissions its own job asks for.
      contents: read
      security-events: write

  # Refuse to release from anything that is not a plain vN.N.N tag. The trigger
  # already filters on v*.*.*, but that glob also matches e.g. v1.2.3-rc$(id),
  # and the value ends up in a Docker tag and a release name.
  check-tag:
    needs: security
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate the release tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::refusing to release from unexpected tag: $TAG"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "✅ Security checks passed for: $TAG"

  # Build binaries for multiple platforms
  build-binaries:
    needs: check-tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            platform: linux
            arch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            platform: linux
            arch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            platform: darwin
            arch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            platform: darwin
            arch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            platform: windows
            arch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod rather than a literal version: setup-go v6+ sets
          # GOTOOLCHAIN=local, so a pinned `go-version` that resolves below
          # go.mod's `go` directive fails the build instead of fetching the
          # newer toolchain.
          go-version-file: go.mod
          # Cache disabled: this workflow publishes release binaries, so a
          # poisoned cache entry written by a lower-privileged run could end up
          # compiled into them. Costs a cold module download per matrix leg.
          cache: false

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.check-tag.outputs.version }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir -p dist
          go build -v \
            -ldflags "-w -s -X=github.com/Searge/k8s-controller/cmd.Version=${VERSION}" \
            -o "dist/kc${EXT}" \
            main.go

      - name: Create archive
        run: |
          cd dist
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            zip -r ../kc.${{ matrix.platform }}.${{ matrix.arch }}.zip kc${{ matrix.ext }}
          else
            tar -czf ../kc.${{ matrix.platform }}.${{ matrix.arch }}.tar.gz kc${{ matrix.ext }}
          fi
          cd ..
          ls -la kc.*

      - name: Upload archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kc-${{ matrix.platform }}-${{ matrix.arch }}
          path: kc.${{ matrix.platform }}.${{ matrix.arch }}.*

  # Build and push Docker images
  build-docker:
    needs: check-tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # pushes the image to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags
        id: meta
        env:
          VERSION: ${{ needs.check-tag.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          # Generate tags manually
          TAGS="${IMAGE}:${VERSION}"
          TAGS="${TAGS},${IMAGE}:latest"

          # Extract semver parts if it's a proper version
          if [[ "$VERSION" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            TAGS="${TAGS},${IMAGE}:${MAJOR}.${MINOR}.${PATCH}"
            TAGS="${TAGS},${IMAGE}:${MAJOR}.${MINOR}"
            TAGS="${TAGS},${IMAGE}:${MAJOR}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Generated tags: ${TAGS}"

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.check-tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Create GitHub Release with all artifacts
  create-release:
    runs-on: ubuntu-24.04
    needs: [check-tag, build-binaries, build-docker]
    permissions:
      contents: write   # creates the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Download the binary artifacts. `pattern` matters: this used to take
      # every artifact in the run, and build-push-action v6+ uploads a build
      # record of its own, so an unrelated .dockerbuild artifact would land in
      # ./artifacts too.
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kc-*
          path: ./artifacts

      # Prepare release files
      - name: Prepare release files
        run: |
          mkdir -p release-files
          find ./artifacts -name "kc.*" -type f -exec cp {} release-files/ \;
          ls -la release-files/

      # Extract changelog
      - name: Extract changelog for this version
        id: changelog
        env:
          VERSION: ${{ needs.check-tag.outputs.version }}
        run: |
          VERSION_NUMBER="${VERSION#v}"
          if [ -f "CHANGELOG.md" ]; then
            awk '/^## \['"$VERSION_NUMBER"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > current_changelog.md
            if [ -s current_changelog.md ]; then
              # Random delimiter: a changelog line that is literally "EOF" would
              # otherwise close the value early, truncating the release body or
              # letting the file inject further step outputs.
              delimiter="changelog_$(uuidgen)"
              {
                echo "changelog<<$delimiter"
                cat current_changelog.md
                echo "$delimiter"
              } >> "$GITHUB_OUTPUT"
            else
              echo "changelog=No changelog found for version $VERSION_NUMBER" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changelog=No CHANGELOG.md file found" >> "$GITHUB_OUTPUT"
          fi

      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.check-tag.outputs.version }}
          name: Release ${{ needs.check-tag.outputs.version }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ## 📦 Downloads

            **Docker Image:**
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.check-tag.outputs.version }}
            ```

            **Binary Archives:**
            - **Linux (amd64)**: `kc.linux.amd64.tar.gz`
            - **Linux (arm64)**: `kc.linux.arm64.tar.gz`
            - **macOS (Intel)**: `kc.darwin.amd64.tar.gz`
            - **macOS (Apple Silicon)**: `kc.darwin.arm64.tar.gz`
            - **Windows (amd64)**: `kc.windows.amd64.zip`

            **Installation:**
            ```bash
            # Linux/macOS
            tar -xzf kc.linux.amd64.tar.gz
            chmod +x kc
            sudo mv kc /usr/local/bin/

            # Windows
            # Extract kc.windows.amd64.zip and add kc.exe to PATH
            ```
          draft: false
          prerelease: ${{ contains(needs.check-tag.outputs.version, '-') }}
          files: |
            release-files/*
          generate_release_notes: true
