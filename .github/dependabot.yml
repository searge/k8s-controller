version: 2
updates:
  # Maintain dependencies for GitHub Actions.
  #
  # `directory` must be "/" here: the docs say dependabot searches
  # `.github/workflows` and a root `action.yml` relative to it, so the
  # previous "/.github" was not the documented form. Whatever it did, this
  # block's settings were not being honoured -- the only actions bumps that
  # ever arrived were `chore(deps)` in an auto-named `github_actions` group,
  # not `ci(deps)` as configured. Monthly on top of that let three major
  # versions of actions/checkout pile up unnoticed.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "github-actions"
    # Same prefix as gomod below so both land in the changelog's Dependencies
    # section; cliff.toml matches on `^deps`.
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"

  # Maintain dependencies for Golang
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
      include: "scope"
    # No `patterns` on purpose: without it the group matches every dependency
    # and `update-types` is the only filter. `patch` has to be listed --
    # `[minor]` alone dropped patch bumps out of the group, so k8s.io/api,
    # k8s.io/apimachinery and k8s.io/client-go 0.36.0 -> 0.36.3 arrived as three
    # separate PRs even though they are one release train. `major` is left out so
    # breaking bumps still come in one PR each.
    groups:
      updates:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
